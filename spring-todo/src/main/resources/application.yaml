spring:
  application:
    name: spring-todo
  # Shared Postgres credentials live in the repo-root .env (gitignored)
  config:
    import: optional:file:../.env[.properties]
  docker:
    compose:
      file: ../compose.yml
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5423}/todo_spring
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
  data:
    web:
      # Spring Data resolves ?page=&size= for Pageable parameters: 1-based pages,
      # missing or invalid size -> 20, larger sizes capped at 100
      pageable:
        one-indexed-parameters: true
        default-page-size: 20
        max-page-size: 100
  jackson:
    # JSON keys match the shared contract and Rails: due_date, created_at, ...
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  # 8080 is taken by another local container
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
