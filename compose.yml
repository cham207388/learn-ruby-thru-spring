services:
  todo-db:
    image: postgres:18-alpine
    container_name: todo-db
    labels:
      # Spring Boot still starts this service, but takes connection details from
      # spring.datasource.* so it can target todo_spring instead of the default DB
      org.springframework.boot.ignore: "true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5423}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent
      - todo-pg-data:/var/lib/postgresql
      # Runs only when the data volume is empty; reset with `docker compose down -v`
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 700m

volumes:
  todo-pg-data:
