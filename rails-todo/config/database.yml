default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5423) %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: todo_rails_development

test:
  <<: *default
  database: todo_rails_test

production:
  primary: &primary_production
    <<: *default
    database: rails_todo_production
    username: rails_todo
    password: <%= ENV["RAILS_TODO_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: rails_todo_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: rails_todo_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: rails_todo_production_cable
    migrations_paths: db/cable_migrate
